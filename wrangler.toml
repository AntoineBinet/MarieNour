# REPLI SERVERLESS (Cloudflare Pages). La PROD tourne sur une VM Oracle + tunnel
# (cf. CLAUDE.md / deployment/DEPLOY.md) ; ce fichier ne sert que pour le mode
# serverless de secours (Pages Functions + D1 + R2, déjà provisionnés).
name = "marienour"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Base de données SQLite (Cloudflare D1).
# Crée-la avec :  wrangler d1 create marienour
# puis colle l'ID renvoyé ci-dessous (database_id).
[[d1_databases]]
binding = "DB"
database_name = "marienour"
database_id = "da427d20-5e7c-4e01-a8e5-aaec2ad48fed"

# Stockage des fichiers / photos (Cloudflare R2).
# Crée-le avec :  wrangler r2 bucket create marienour-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "marienour-media"

# Variables NON secrètes. Les secrets (ADMIN_PASSWORD, SESSION_SECRET,
# RESEND_API_KEY) se définissent via `wrangler pages secret put ...` en prod,
# et dans le fichier .dev.vars en local (voir .dev.vars.example).
[vars]
ADMIN_EMAIL = "binet.antoine215@yahoo.com"
APP_NAME = "MarieNour"
# Expéditeur des e-mails (non secret). Le RESEND_API_KEY, lui, est un secret.
# MAIL_FROM = "MarieNour <hello@marienour.work>"
