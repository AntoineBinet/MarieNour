<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, interactive-widget=resizes-content" />
    <!-- Deux variantes pour éviter le flash beige clair au lancement en thème sombre
         (avant l'exécution de theme.ts) ; le JS pose ensuite une balise sans media
         qui reflète la vraie couleur de fond (packs design compris) et prime. -->
    <meta name="theme-color" content="#f6efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1916" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent : barre d'état iOS transparente, l'app dessine bord à bord
         (les safe-areas env() sont déjà gérées par la coquille). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarieNour" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MarieNour — ton atelier</title>
    <meta
      name="description"
      content="L'atelier personnel pour tout garder, planifier et partager : checklists, voyages, recettes, inspirations et idées, au même endroit."
    />
    <link rel="canonical" href="https://marienour.work/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (aperçu de lien : WhatsApp, iMessage, Messenger, Slack, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarieNour" />
    <meta property="og:title" content="MarieNour — ton atelier" />
    <meta
      property="og:description"
      content="Tout garder, planifier et partager au même endroit : listes, voyages, recettes, inspirations et fil d'amis."
    />
    <meta property="og:url" content="https://marienour.work/" />
    <meta property="og:image" content="https://marienour.work/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MarieNour — ton atelier personnel" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarieNour — ton atelier" />
    <meta
      name="twitter:description"
      content="Tout garder, planifier et partager au même endroit : listes, voyages, recettes, inspirations et fil d'amis."
    />
    <meta name="twitter:image" content="https://marienour.work/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
